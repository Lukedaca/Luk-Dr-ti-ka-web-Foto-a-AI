[build]
  command = "npm run build"
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self' https://challenges.cloudflare.com https://static.cloudflareinsights.com 'sha256-aGosg6+bP1pnRHQ3BNuvT7tqjTqcnzzvuo7NvNJwnHk=' 'sha256-URiS2wsmwx8O6AuQzA9/G5CT3SEi93sO70Zh51dbmHk=' 'sha256-ON8g0Dkx8wyZQB4qxUqLYOvZRfsR+AlRfIA+PPBDc1I=' 'sha256-WWEYC1hWNrteYb/lqja432e6fHrntUWGxuLe6M58Zj8=' 'sha256-qJklg89FyV2VRajtMPLdQ78HNuH6Q40/puTR13Q6OkE=' 'sha256-eeArhDL+PiDXKMDQxqUBVwXAAasS50SQEEpCcNFzcgQ=' 'sha256-VuCS6BEiLxfceB3kQ0PX6RtyV/KaTdXnKBwbsdnqxtA=' 'sha256-QjHTc/H2BM/N7sugWW9y5HFMs8+jhcQQZjJC2YAoicI=' 'sha256-2jUUE/roqBQlUCdrOEM7oCN98hzdd2L8iJb27I/6h6A='; script-src-attr 'none'; frame-src https://challenges.cloudflare.com; connect-src 'self' wss://generativelanguage.googleapis.com https://challenges.cloudflare.com https://cloudflareinsights.com; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(self), geolocation=(), interest-cohort=()"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/dist/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/.well-known/security.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "/security.txt"
  to = "/.well-known/security.txt"
  status = 301

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
