<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e27"/>
      <stop offset="50%" style="stop-color:#1a1f3a"/>
      <stop offset="100%" style="stop-color:#0a0e27"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="150" fill="#3b82f6" opacity="0.1"/>
  <circle cx="1100" cy="530" r="200" fill="#8b5cf6" opacity="0.1"/>
  <circle cx="900" cy="100" r="100" fill="#22d3ee" opacity="0.1"/>

  <!-- Logo circle -->
  <circle cx="600" cy="220" r="80" fill="url(#accent)" filter="url(#glow)"/>
  <text x="600" y="245" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="white" text-anchor="middle">LD</text>

  <!-- Name -->
  <text x="600" y="360" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle">Lukas Drsticka</text>

  <!-- Tagline -->
  <text x="600" y="420" font-family="Arial, sans-serif" font-size="32" fill="#9ca3af" text-anchor="middle">Fotograf &amp; AI Developer</text>

  <!-- Subtitle -->
  <text x="600" y="480" font-family="Arial, sans-serif" font-size="24" fill="#6b7280" text-anchor="middle">Fotografie | AI Chatbots | Automatizace</text>

  <!-- URL -->
  <text x="600" y="580" font-family="Arial, sans-serif" font-size="20" fill="#3b82f6" text-anchor="middle">lukasdrsticka.cz</text>
</svg>
