<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Stránka nenalezena | Lukáš Drštička</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0a0e27 100%);
            min-height: 100vh;
        }
        .gradient-text {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="text-white flex items-center justify-center">
    <div class="text-center px-6 py-12">
        <div class="mb-8">
            <a href="/" class="inline-flex items-center space-x-3">
                <div class="bg-gradient-to-br from-blue-500 to-purple-600 rounded-full h-12 w-12 flex items-center justify-center font-bold">
                    LD
                </div>
                <span class="text-xl font-semibold">Lukáš Drštička</span>
            </a>
        </div>

        <h1 class="text-8xl md:text-9xl font-bold gradient-text mb-4">404</h1>
        <h2 class="text-2xl md:text-3xl font-semibold mb-4">Stránka nenalezena</h2>
        <p class="text-gray-400 mb-8 max-w-md mx-auto">
            Omlouváme se, ale stránka, kterou hledáte, neexistuje nebo byla přesunuta.
        </p>

        <div class="flex gap-4 justify-center flex-wrap">
            <a href="/" class="px-8 py-4 bg-gradient-to-r from-blue-600 to-purple-600 rounded-full font-semibold hover:opacity-90 transition shadow-lg">
                Zpět na hlavní stránku
            </a>
            <a href="/#kontakt" class="px-8 py-4 glass rounded-full font-semibold hover:bg-white/10 transition">
                Kontaktovat
            </a>
        </div>

        <div class="mt-16 text-gray-500 text-sm">
            <p>Nebo zkuste některou z těchto sekcí:</p>
            <div class="flex gap-6 justify-center mt-4">
                <a href="/#portfolio" class="hover:text-blue-400 transition">Portfolio</a>
                <a href="/#skills" class="hover:text-blue-400 transition">Dovednosti</a>
                <a href="/#o-mne" class="hover:text-blue-400 transition">O mně</a>
            </div>
        </div>
    </div>
</body>
</html>
