<body class="photo-subpage">
    <a href="#main" class="skip-link">Přeskočit na hlavní obsah</a>
    <main id="main" class="gallery-page" tabindex="-1">
        <section class="gallery-hero">
            <span class="gallery-kicker">Sportovní fotografie</span>
            <h1 class="gallery-title">SK Sigma Olomouc vs 1.FC Slovácko</h1>
            <p class="gallery-copy">Samostatná galerie ze zápasu SK Sigma Olomouc vs 1.FC Slovácko, 19. dubna 2026.</p>
            <div class="gallery-meta">
                <span>13 vybraných fotek</span>
                <span>19.4.2026</span>
                <span>Lukáš Drštička</span>
            </div>
            <div class="gallery-actions">
                <a class="gallery-link primary" href="/#portfolio">Zpět na portfolio</a>
                <a class="gallery-link secondary" href="mailto:lukas.drsticka@gmail.com?subject=SK%20Sigma%20Olomouc%20vs%201.FC%20Slov%C3%A1cko%2019.4.2026">Chci podobnou galerii</a>
            </div>
        </section>

        <section class="gallery-grid" id="matchGallery" aria-label="Galerie SK Sigma Olomouc vs 1.FC Slovácko 19.4.2026"></section>
    </main>

    <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Galerie zápasu SK Sigma Olomouc vs 1.FC Slovácko">
        <button id="closeLightbox" class="absolute top-8 right-8 text-white text-4xl hover:text-gray-300 z-10" aria-label="Zavřít galerii">&times;</button>
        <div id="lightboxControls" class="absolute inset-0 flex items-center justify-between px-6 pointer-events-none">
            <button id="lightboxPrev" class="pointer-events-auto h-12 w-12 rounded-full bg-black/40 text-white text-3xl flex items-center justify-center hover:bg-black/60 transition" aria-label="Předchozí fotka">&lsaquo;</button>
            <button id="lightboxNext" class="pointer-events-auto h-12 w-12 rounded-full bg-black/40 text-white text-3xl flex items-center justify-center hover:bg-black/60 transition" aria-label="Další fotka">&rsaquo;</button>
        </div>
        <picture>
            <source id="lightboxSourceAvif" type="image/avif" srcset="">
            <source id="lightboxSourceWebp" type="image/webp" srcset="">
            <img id="lightboxImg" src="" alt="">
        </picture>
    </div>

    <script>
        const galleryImages = [
            'IMG_9399', 'IMG_9407', 'IMG_9411', 'IMG_9412', 'IMG_9424',
            'IMG_9431', 'IMG_9435', 'IMG_9449', 'IMG_9468', 'IMG_9497',
            'IMG_9515', 'IMG_9517', 'IMG_9518'
        ].map((name, index) => ({
            thumb: `/assets/portfolio/sigma-vs-slovacko/thumbs/${name}.jpg`,
            full: `/dist/images/portfolio/sigma-vs-slovacko/${name}.jpg`,
            fullWebp: `/dist/images/portfolio/sigma-vs-slovacko/${name}.webp`,
            fullAvif: `/dist/images/portfolio/sigma-vs-slovacko/${name}.avif`,
            alt: `SK Sigma Olomouc vs 1.FC Slovácko – fotka ${index + 1}`
        }));

        const galleryRoot = document.getElementById('matchGallery');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');
        const closeLightboxBtn = document.getElementById('closeLightbox');
        const lightboxPrev = document.getElementById('lightboxPrev');
        const lightboxNext = document.getElementById('lightboxNext');
        const lightboxControls = document.getElementById('lightboxControls');

        let currentIndex = 0;

        function renderGallery() {
            galleryRoot.innerHTML = galleryImages.map((image, index) => `
                <button class="gallery-card" type="button" data-index="${index}" aria-label="Otevřít fotku ${index + 1}">
                    <img src="${image.thumb}" alt="${image.alt}" loading="${index < 6 ? 'eager' : 'lazy'}">
                    <span>Fotka ${index + 1}</span>
                </button>
            `).join('');

            galleryRoot.querySelectorAll('.gallery-card').forEach((card) => {
                card.addEventListener('click', () => openLightbox(Number(card.dataset.index)));
            });
        }

        const lightboxSourceAvif = document.getElementById('lightboxSourceAvif');
        const lightboxSourceWebp = document.getElementById('lightboxSourceWebp');

        function updateLightbox() {
            const image = galleryImages[currentIndex];
            if (lightboxSourceAvif) lightboxSourceAvif.srcset = image.fullAvif || '';
            if (lightboxSourceWebp) lightboxSourceWebp.srcset = image.fullWebp || '';
            lightboxImg.src = image.full;
            lightboxImg.alt = `${image.alt} (${currentIndex + 1}/${galleryImages.length})`;
            lightboxPrev.classList.toggle('opacity-40', currentIndex === 0);
            lightboxPrev.classList.toggle('pointer-events-none', currentIndex === 0);
            lightboxNext.classList.toggle('opacity-40', currentIndex === galleryImages.length - 1);
            lightboxNext.classList.toggle('pointer-events-none', currentIndex === galleryImages.length - 1);
            lightboxControls.classList.toggle('hidden', galleryImages.length <= 1);
        }

        function openLightbox(index) {
            currentIndex = index;
            updateLightbox();
            lightbox.classList.add('active');
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
        }

        function moveLightbox(step) {
            const nextIndex = currentIndex + step;
            if (nextIndex < 0 || nextIndex >= galleryImages.length) return;
            currentIndex = nextIndex;
            updateLightbox();
        }

        closeLightboxBtn.addEventListener('click', closeLightbox);
        lightbox.addEventListener('click', (event) => {
            if (event.target === lightbox) {
                closeLightbox();
            }
        });
        lightboxPrev.addEventListener('click', () => moveLightbox(-1));
        lightboxNext.addEventListener('click', () => moveLightbox(1));

        document.addEventListener('keydown', (event) => {
            if (!lightbox.classList.contains('active')) return;
            if (event.key === 'Escape') closeLightbox();
            if (event.key === 'ArrowLeft') moveLightbox(-1);
            if (event.key === 'ArrowRight') moveLightbox(1);
        });

        renderGallery();
    </script>
</body>
</html>
